# Kafka Configuration
kafka.bootstrap.servers=192.168.128.141:9092
kafka.source.topic=orders
kafka.normal.topic=orders_valid
kafka.invalid.topic=orders_invalid
kafka.group.id=data-quality-monitor

# MySQL Configuration
mysql.url=jdbc:mysql://192.168.128.141:3306/data_quality?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
mysql.username=root
mysql.password=123456

# Redis Configuration
redis.host=192.168.128.141
redis.port=6379

# ClickHouse Configuration
clickhouse.url=jdbc:clickhouse://192.168.128.141:8123/data_quality
clickhouse.username=default
clickhouse.password=

# Flink Configuration
flink.parallelism=32
flink.checkpoint.interval=60000

# Spring Boot Server Configuration (for performance testing)
server.port=8080
# Enable HTTP Keep-Alive
server.tomcat.connection-timeout=60000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100
# Thread pool configuration
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
