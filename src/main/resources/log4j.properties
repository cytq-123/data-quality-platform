log4j.rootLogger=INFO, console

# Console Appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Set log level for specific packages
log4j.logger.com.dataplatform.quality=INFO
log4j.logger.org.apache.flink=WARN
log4j.logger.org.apache.kafka=WARN
log4j.logger.org.apache.kafka.clients=WARN
log4j.logger.org.apache.kafka.clients.producer=WARN
log4j.logger.org.apache.kafka.clients.NetworkClient=WARN
